name: Build A13 install test APK

on:
  push:
    branches:
      - codex/nexus-screenrecordpro-a13-install-review-20261029
    paths:
      - "NexusScreenRecordPro/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: NexusScreenRecordPro
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.1"

      - name: Build signed non-debuggable APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK signature and manifest
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.1/aapt" dump badging "$APK" | grep -E "^(package:|sdkVersion:|targetSdkVersion:)"

      - name: Upload install-test APK
        uses: actions/upload-artifact@v4
        with:
          name: NexusScreenRecordPro-A13-install-test
          path: NexusScreenRecordPro/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
