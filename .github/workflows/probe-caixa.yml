name: Probe oficial CAIXA

on:
  push:
    branches: [feat/neon-carrossel-mobile-careca]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar apenas os endpoints oficiais
        run: |
          for game in megasena lotofacil quina lotomania; do
            code=$(curl --silent --show-error --max-time 15 -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36' -H 'Accept: application/json' -H 'Referer: https://loterias.caixa.gov.br/Paginas/default.aspx' -o "/tmp/${game}.json" -w '%{http_code}' "https://servicebus2.caixa.gov.br/portaldeloterias/api/${game}" || true)
            echo "${game}: HTTP ${code}"
            head -c 160 "/tmp/${game}.json" || true
            echo
          done
