name: App regression tests

on:
  push:
    branches: [main, fix/garantias-e-historico]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run regression tests
        run: node --test tests/guarantees.test.js tests/pwa.test.js
