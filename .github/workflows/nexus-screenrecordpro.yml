name: Build Nexus Screen Record Pro APK

on:
  push:
    branches:
      - codex/nexus-screenrecordpro-a13-install-review-20261029
    paths:
      - "NexusScreenRecordPro/app/**"
      - "NexusScreenRecordPro/build.gradle.kts"
      - "NexusScreenRecordPro/settings.gradle.kts"
      - ".github/workflows/nexus-screenrecordpro.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK tools
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.1"

      - name: Build official APK
        working-directory: NexusScreenRecordPro
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK signature and package
        run: |
          APK="NexusScreenRecordPro/app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.1/aapt" dump badging "$APK" | grep -E "^(package:|sdkVersion:|targetSdkVersion:)"

      - name: Publish direct APK download
        run: |
          mkdir -p NexusScreenRecordPro/dist
          cp NexusScreenRecordPro/app/build/outputs/apk/debug/app-debug.apk NexusScreenRecordPro/dist/NexusScreenRecordPro-A13-Oficial-1.0.0.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NexusScreenRecordPro/dist/NexusScreenRecordPro-A13-Oficial-1.0.0.apk
          git commit -m "Publish Nexus Screen Record Pro 1.0.0 APK [skip ci]"
          git push

      - name: Upload official APK
        uses: actions/upload-artifact@v4
        with:
          name: NexusScreenRecordPro-A13-Oficial-1.0.0
          path: NexusScreenRecordPro/dist/NexusScreenRecordPro-A13-Oficial-1.0.0.apk
          if-no-files-found: error
          retention-days: 14
